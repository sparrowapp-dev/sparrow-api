name: Self-host Docker Image
on:

  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to build"
        required: true
        default: release-v2
        type: string
      image_version:
        description: "Docker image version (e.g. 1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: self-host

    env:
      DOCKER_IMAGE_VERSION: ${{ inputs.image_version }}
      BUILD_BRANCH: ${{ inputs.branch }}
      DOCKER_IMAGE_NAME: sparrowapi/sparrow-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_BRANCH }}
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.SPARROW_DOCKERHUB_USERNAME }}
          password: ${{ secrets.SPARROW_DOCKERHUB_PASSWORD }}

      - name: Build and push (multi-arch)
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg GITHUB_TOKEN=${{ secrets.SPARROW_GITHUB_TOKEN }} \
            -t $DOCKER_IMAGE_NAME:${DOCKER_IMAGE_VERSION} \
            -t $DOCKER_IMAGE_NAME:latest \
            --push .