version: "3.8"

services:
  # MongoDB
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: sparowapp
      MONGO_INITDB_ROOT_PASSWORD: sparrow123
    networks:
      - localnet

  # Redis (for BullMQ job scheduling)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - localnet
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  # Api
  api:
    build:
      context: .
    ports:
      - "9000:9000"
      - "9001:9001"
      - "9002:9002"
    volumes:
      - ./:/src
    networks:
      - localnet
    depends_on:
      - mongo
      - redis
    env_file: ".env"

volumes:
  redis-data:

networks:
  localnet:
    driver: bridge
